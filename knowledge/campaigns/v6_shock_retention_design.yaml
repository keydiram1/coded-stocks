# DESIGN_ONLY. Not frozen. Not approved. Do not execute. Do not run D1.
campaign_id: v6_market_residual_shock_retention
version: v6
science_id: v6_market_residual_shock_retention_v1
status: SIGNAL_ONLY
execution_status: NOT_APPROVED
reviewer_approval_required: true
frozen_before_empirical_execution: false
sealed_oos: inaccessible
parent_campaigns: []
close_dislocation_family: CLOSED_NO_EDGE
v5_options_local_rv: DESIGN_ONLY_NOT_READY
supersedes_name: IDIO_SHOCK_RETENTION_V1
rename_reason: >
  Residual removes only equal-weight LOO market return. No causal sector
  factor is introduced. Do not claim fully idiosyncratic shocks.
note: >
  DESIGN_ONLY for MARKET_RESIDUAL_SHOCK_RETENTION_V1. Do not run D1/D2/D3.
  Do not promote H2 or H3. Do not reopen close-dislocation. Do not use
  options aggregates. No threshold may be added after D1 begins.

MARKET_RESIDUAL_SHOCK_RETENTION_V1:
  mechanism_id: market_residual_shock_information_vs_flow
  hypothesis_family: shock_retention
  auction_claim: false
  executable_claim: false
  neutralization_claim: loo_equal_weight_market_only_not_sector_idio

  clocks:
    bar_label: minute_bar_start_ET
    bar_interval: "[t, t+1m)"
    completed_price: official_minute_close
    P0: completed close of the minute immediately before impulse start
    P1: completed close of the last impulse minute
    P2: completed close of the last wait minute
    T1: P2_bar
    signal_available_at: T1_close_plus_0s  # first instant T1 close exists; research uses T1+1m as known
    skip_open: T1_plus_1_open
    primary_entry: T1_plus_2_open
    primary_horizon_minutes: 15
    timeline: >
      Impulse uses W_imp consecutive completed RTH minutes.
      Wait is the next W_wait consecutive completed minutes (no gap).
      P0 = close(t_imp0 - 1m). P1 = close(t_imp0 + W_imp - 1m).
      P2 = close(t_imp0 + W_imp + W_wait - 1m). T1 is that P2 bar.
      T1 close is known at T1+1m. Do not enter at T1+1 open.
      Primary research entry is the open of T1+2. Outcome is that open
      to the close 15 completed minutes later (diagnostic 5m/30m).
    no_current_unfinished_minute: true

  residual:
    stock_simple: P_end / P_start - 1
    market: equal_weight_LOO_eligible_peers_same_P_start_P_end
    beta: causal_20_prior_sessions_inherited_V5
    formula: r_stock - beta * r_market_loo
    impulse_residual: residual(P0 -> P1)
    remaining_residual: residual(P0 -> P2)
    sector_factor: not_used
    missing_peer_bars: drop_peer_from_that_window_LOO_no_imputation

  shock_z:
    formula: impulse_residual / prior_same_clock_residual_std
    prior_sessions: exact_20_research_sessions_immediately_before_event_day
    same_clock: same_ET_impulse_start_and_same_W_imp
    historical_residual: contemporaneous_beta_and_LOO_on_that_session
    ddof: 1
    require_all_20_finite: true
    reachback: false
    imputation: false
    current_day_in_scale: false
    scale_null_if: any_of_20_missing_or_nonfinite_or_std_le_0_or_all_equal
    direction_sign: sign(impulse_residual)
    z_does_not_set_direction: true

  retention:
    formula: remaining_residual / impulse_residual
    clip: false
    zero_denominator: null_event_ineligible_H1_H2
    near_zero_denominator: >
      No epsilon clip. |shock_z| min gate plus std>0 already requires a
      large impulse_residual versus own same-clock history. If
      impulse_residual is 0 or nonfinite, retention is null.
    negative_retention: keep_as_is
    retention_gt_1: keep_as_is
    extreme_ratios: keep_as_is_no_winsor
    missing_bars: event_invalid_if_any_required_stock_minute_from_P0_through_P2_missing

  eligibility:
    inherit_from: V5_COMMON_STOCK_NASDAQ_NYSE_NYSE_AMERICAN
    price_prev_close_min: 1.00
    trailing_20d_median_rth_dollar_volume_min: 1000000
    listing_pit: instruments.parquet_last_snapshot_not_session_dated
    exclude_open_window: true
    exclude_close_window: true
    impulse_window_entirely_in: 10:00_to_14:00_ET
    wait_window_must_finish_by: 14:30_ET
    half_days: exclude
  causal_feature_availability: >
    Beta, LOO membership, eligibility dollar volume, prev_close, and the
    20-session same-clock residual history use completed prior sessions
    only. Impulse and wait use only minutes whose close is known before
    the T1+2 open.
  event_policy: one_event_per_ticker_day
  event_choice: first_qualifying_large_shock_impulse_of_the_session
  do_not_use_v2_pullback_band: true

  time_of_day:
    own_vol: exact_same_clock_window_not_coarse_bucket
    matching_buckets_et_on_T1: ["10:00", "10:30", "11:00", "11:30", "12:00", "12:30", "13:00", "13:30", "14:00"]
    matching_bucket_width_minutes: 30
    post_hoc_morning_midday_afternoon_slicing: forbidden
    later_tod_cut_search: forbidden

  shock_z_match_buckets:
    - {lo: 2.0, hi: 2.5, right: exclusive}
    - {lo: 2.5, hi: 3.0, right: exclusive}
    - {lo: 3.0, hi: inf, right: inclusive}

  hypotheses:
    - hypothesis_id: H1_HIGH_RETENTION_CONTINUATION
      role: primary
      universe: abs_shock_z_ge_min
      retention: ge_high_retention_min
      direction: continue_sign_of_impulse_residual
      campaign_success_requires_this: true
    - hypothesis_id: H2_LOW_RETENTION_REVERSAL
      role: robustness
      universe: abs_shock_z_ge_min
      retention: le_low_retention_max
      direction: reverse_sign_of_impulse_residual
      do_not_promote_to_primary: true
      cannot_rescue_h1: true
    - hypothesis_id: H3_IMPULSE_ONLY_CONTROL
      role: control
      universe: abs_shock_z_ge_min
      retention: ignored
      direction: continue_sign_of_impulse_residual
      do_not_promote_to_primary: true
      cannot_rescue_h1: true

  incremental_control:
    purpose: H1_must_add_information_beyond_large_shock_momentum
    method: stratify_then_within_stratum_difference
    strata:
      - sign_impulse_residual
      - abs_shock_z_bucket
      - T1_30m_et_bucket
    sign_impulse_residual: [POSITIVE, NEGATIVE]
    sign_rule: POSITIVE_if_impulse_residual_gt_0_NEGATIVE_if_lt_0
    zero_residual_ineligible: true
    abs_shock_z_buckets: shock_z_match_buckets
    treated: H1_events
    control: H3_events_in_stratum_with_retention_lt_high_retention_min
    no_cross_sign_matching: true
    no_imputation: true
    one_sided_strata_do_not_contribute: true
    stratum_delta: >
      Within each day and two-sided stratum, delta =
      mean(signed forward return of H1 treated)
      minus
      mean(signed forward return of eligible impulse-only controls).
    day_delta: equal_weight_mean_of_valid_stratum_deltas_that_day
    estimand: equal_weight_trading_day_mean_of_day_deltas
    required_gate_on_h1: day_delta_mean_gt_0
    hierarchical_not_fourth_hypothesis: true
    cannot_rescue_h1: true
    economic_floor_on_delta: none
    inference:
      n_matched_days: required
      mean_day_delta: required
      se_across_daily_deltas: required
      hypothesis: one_sided_H0_mean_day_delta_le_0
      p_one_sided: required
      bootstrap_unit: trading_day
      bootstrap_draws: 1000
      bootstrap_seed: 42
      same_philosophy_as_h1_equal_day: true
    d1_requires:
      mean_day_delta_gt_0: true
      p_one_sided: not_required
      n_matched_days_min: not_required
    d2_d3_requires:
      mean_day_delta_gt_0: true
      p_one_sided_lt: 0.05
      n_matched_days_min: 100
    h2_h3_cannot_satisfy_this_gate: true

  d1_grid:
    frozen_before_d1: true
    impulse_window_minutes: [5, 15]
    wait_window_minutes: [5, 15]
    min_abs_shock_z: [2.0]
    high_retention_min: [0.50]
    low_retention_max: [0.00]
    motivation:
      impulse_5: shortest_multi_bar_pulse_not_a_single_OHLC_bar
      impulse_15: one_short_execution_slice_not_a_trend
      wait_5: first_completed_replenishment_window
      wait_15: longer_flow_dissipation_still_same_session
      z_2: inherited_abnormal_own_vol_convention_from_V5_continuation_scale
      high_0_50: majority_of_market_residual_shock_still_present
      low_0_00: shock_fully_given_back_or_reversed
    frozen_cells:
      - {id: W5_W5, impulse_window_minutes: 5, wait_window_minutes: 5, min_abs_shock_z: 2.0, high_retention_min: 0.50, low_retention_max: 0.00}
      - {id: W5_W15, impulse_window_minutes: 5, wait_window_minutes: 15, min_abs_shock_z: 2.0, high_retention_min: 0.50, low_retention_max: 0.00}
      - {id: W15_W5, impulse_window_minutes: 15, wait_window_minutes: 5, min_abs_shock_z: 2.0, high_retention_min: 0.50, low_retention_max: 0.00}
      - {id: W15_W15, impulse_window_minutes: 15, wait_window_minutes: 15, min_abs_shock_z: 2.0, high_retention_min: 0.50, low_retention_max: 0.00}
    cartesian_combinations: 4
    d1_parameter_cells: 4
    d1_selection_looks: 4
    confirmatory_hypotheses: 3
    confirmatory_hypotheses_after_freeze: 3
    total_effective_discovery_trials: 4
    d1_does_not_use_h2_or_h3_for_selection: true
    d1_significance_required: false
    no_threshold_after_d1_begins: true
    cell_eligible_for_selection_iff:
      - H1_passes_preregistered_sample_and_concentration_gates
      - H1_equal_day_mean_gt_0
      - incremental_matched_day_delta_mean_gt_0
    selection_among_eligible: freeze_cell_with_maximum_H1_equal_day_mean
    if_no_eligible_cell: KILL_AT_D1
    selection_rule: >
      Evaluate exactly the 4 frozen cells on D1. A cell is eligible only
      if H1 passes sample/concentration gates AND H1 equal-day mean > 0
      AND incremental matched day-delta mean > 0. Among eligible cells,
      freeze the cell with maximum H1 equal-day mean. If none eligible:
      KILL_AT_D1. Do not open D2 or D3. Do not select a cell with generic
      momentum but no incremental retention effect. H2/H3 cannot become
      primary. No new parameter values.

  multiplicity:
    discovery_d1_parameter_cells: 4
    confirmatory_signal_hypotheses: 3
    confirmatory_hypotheses_after_cell_freeze: 3
    confirmatory_ids: [H1_HIGH_RETENTION_CONTINUATION, H2_LOW_RETENTION_REVERSAL, H3_IMPULSE_ONLY_CONTROL]
    incremental_mechanism_gate: 1
    incremental_mechanism_gate_role: hierarchical_required_on_H1
    d1_search_is_not_one_exploratory_look: true
    d2_d3_bh_q: 0.10
    d2_d3_bh_across: confirmatory_H1_H2_H3
    d1_cells_not_in_d2_d3_bh: true
    incremental_not_in_bh: true

  trial_count_confirmatory: 3
  primary_outcome: T1_plus_2_open_to_15m
  diagnostic_outcomes: [T1_plus_2_open_to_5m, T1_plus_2_open_to_30m]
  primary_estimand: equal_weight_trading_day_mean
  inference_unit: trading_day
  inference:
    one_sided: greater_than_zero_on_signed_primary
    bootstrap_daily_means: 1000
    seed: 42
    multiple_testing: BH
    bh_q: 0.10
    jointly_across: confirmatory_H1_H2_H3
    d1_grid_not_in_d2_d3_bh: true
  sample:
    min_ticker_days: 750
    min_trading_days: 100
    min_tickers: 75
    max_top_ticker_share: 0.50
    min_win_rate: 0.48
    counts_on: finite_primary_signed_only
  economic_floor_bp: 12
  economic_floor_note: inherited_research_standard_not_reoptimized

  promotion:
    sequence: [D1, D2, D3]
    h1_remains_primary: true
    h2_h3_cannot_become_primary: true
    h2_h3_cannot_rescue: true
    no_refit: true
    no_window_or_threshold_changes_after_d1_freeze: true
    d1:
      evaluate: exactly_the_frozen_4_cell_grid
      select_at_most: 1
      freeze_selected_cell: true
      if_no_eligible_cell: KILL_AT_D1
      do_not_evaluate_d2_or_d3_if_kill: true
      significance_threshold: none
    d2:
      evaluate: only_the_single_D1_frozen_cell
      open_only_if: D1_selected_one_eligible_cell
      subject: H1_PRIMARY
      sample_gates: inherit_sample
      concentration_gates: max_top_ticker_share_le_0.50
      sign_requirement: H1_equal_day_mean_gt_0
      statistical_requirement: H1_is_BH_survivor_q_0_10_across_H1_H2_H3
      economic_floor_bp: 3
      economic_floor: inherited_V5_D2_3bp_not_reoptimized
      incremental_day_delta_requirement: day_delta_mean_gt_0
      incremental_p_one_sided_lt: 0.05
      incremental_n_matched_days_min: 100
      incremental_economic_floor: none
      h1_fails_any_required_primary_gate: KILL_campaign_DO_NOT_OPEN_D3
      refit: false
      move_thresholds: false
      flip_direction: false
    d3:
      open_only_if: H1_survives_all_D2_primary_gates
      evaluate: exact_same_frozen_cell_features_entry_H1_H2_H3
      refit: false
      statistical_gate: H1_is_BH_survivor_q_0_10_across_H1_H2_H3
      bh_q: 0.10
      bh_across: confirmatory_H1_H2_H3
      economic_floor_bp: 12
      economic_floor: inherited_V5_D3_12bp_not_reoptimized
      incremental_day_delta_gate: day_delta_mean_gt_0
      incremental_p_one_sided_lt: 0.05
      incremental_n_matched_days_min: 100
      incremental_economic_floor: none
      if_h1_ge_12bp_but_incremental_unsupported: PRIMARY_SIGNAL_POSITIVE_BUT_RETENTION_NOT_INCREMENTAL
      sign_requirement: H1_equal_day_mean_gt_0
      require_sign_match_d2: true
      sample_gates: inherit_sample
      concentration_gates: max_top_ticker_share_le_0.50
      if_mean_le_0: KILL
      if_not_bh_survivor: KILL
      if_incremental_day_delta_le_0: KILL
      if_bh_survivor_and_0_lt_mean_lt_12bp: VALIDATED_SUBTHRESHOLD_PHENOMENON_not_v6_success
      RESEARCH_PASS_requires:
        - H1_PRIMARY_itself_passes
        - H1_D3_BH_survivor_q_0_10
        - H1_equal_day_mean_ge_12bp
        - incremental_day_delta_mean_gt_0
        - incremental_p_one_sided_lt_0.05
        - incremental_n_matched_days_ge_100
        - sample_and_concentration_gates
        - sign_positive_and_matches_D2
      h2_or_h3_pass_cannot_create_RESEARCH_PASS: true

  splits:
    method: chronological_unsealed
    warmup_last_day: '2021-10-28'
    discovery_D1: {start: '2021-10-29', end: '2023-10-17', n_days: 494, role: discovery_grid_selection_then_freeze}
    validation_D2: {start: '2023-10-18', end: '2024-10-10', n_days: 247, role: frozen_validation}
    confirmation_D3: {start: '2024-10-11', end: '2026-10-01', n_days: 494, role: confirmation}
    sealed_oos: closed_do_not_open
    d3_language: >
      D3 is not globally untouched. It was inspected in unrelated prior
      campaigns (close-dislocation reversal/continuation). It is valid
      confirmation here only because this exact V6 hypothesis, features,
      thresholds, and decisions will be frozen before any V6 D3 result
      is viewed. Sealed OOS remains untouched.
  campaign_success:
    requires: H1_PRIMARY_pass
    research_pass_rule: promotion.d3.RESEARCH_PASS_requires
    h1_must_also: incremental_day_delta_mean_gt_0_and_p_lt_0.05_and_n_matched_days_ge_100
    h2_pass_h1_fail: secondary_observation_only_not_v6_success
    h3_pass_h1_fail: generic_impulse_continuation_only_not_v6_success
  falsification:
    - no_eligible_D1_cell
    - H1_fails_any_D2_primary_gate
    - D3_opened_without_H1_D2_survival
    - H1_signed_mean_le_0_on_D3
    - H1_not_BH_survivor
    - incremental_day_delta_mean_le_0
    - incremental_p_one_sided_ge_0.05_on_D2_or_D3
    - incremental_n_matched_days_lt_100_on_D2_or_D3
    - RESEARCH_PASS_without_incremental_inference
    - treated_positive_matched_to_negative_control
    - H2_or_H3_promoted_to_campaign_success
    - T1_plus_1_open_used_as_primary_entry
    - reopen_close_dislocation
    - claim_fully_idiosyncratic_without_sector_factor
  execution_limitations:
    - OHLCV_is_not_a_fill
    - T1_plus_2_open_is_research_clock_only
    - implementation_latency_is_one_extra_completed_minute
    - shocked_names_have_wide_spreads
    - short_leg_needs_borrow_not_in_data
    - microcap_excluded_by_dollar_volume_but_still_not_NBBO
    - capacity_unknown
    - paper_15m_edge_must_exceed_spread_plus_slippage_later
