# DESIGN_ONLY. Not frozen. Not approved. Do not execute. Do not run D1.
campaign_id: v7_shock_resolution_through_time
version: v7
science_id: v7_shock_response_surface_v1
status: DESIGN_ONLY
execution_status: NOT_APPROVED
reviewer_approval_required: true
frozen_before_empirical_execution: false
sealed_oos: inaccessible
parent_campaigns: [MARKET_RESIDUAL_SHOCK_RETENTION_V1]
v6_family: CLOSED_NO_EDGE
close_dislocation_family: CLOSED_NO_EDGE
v5_options_local_rv: DESIGN_ONLY_NOT_READY
note: >
  DESIGN_ONLY for a response-surface campaign. Do not run D1/D2/D3.
  Do not reopen V6. Do not buy options. Minute OHLCV can discover a
  predictive phenomenon; it cannot claim executable profit.

architecture:
  pipeline:
    - MECHANISM
    - EVENT
    - RESPONSE_CURVE
    - STABILITY
    - CANDIDATE_RULE
    - FREEZE
    - VALIDATION
  d1_purpose: understand_shape_of_signed_residual_response_not_max_cell
  not_a_magical_timestamp: true
  feature_is_not_phenomenon: true
  phenomenon_is_not_candidate_rule: true
  candidate_rule_is_not_validated: true
  validated_is_not_trading_edge: true
  trading_edge_is_not_executable_profit: true

primary_research_question: >
  After a substantial market-relative stock shock, how does the stock's
  subsequent signed residual return evolve through time?

shape_classes:
  - persistent_repricing
  - continuation
  - reversal
  - temporary_continuation_then_reversal
  - delayed_continuation
  - fast_decay
  - no_stable_effect

MARKET_RELATIVE_SHOCK_RESOLUTION_V1:
  role: primary_proposed_family_A
  execute_now: false
  mechanism_id: market_relative_shock_resolution_through_time
  residual:
    stock_simple: P_end / P_start - 1
    market: equal_weight_LOO_causally_eligible_peers_same_window
    beta: causal_20_prior_sessions_on_listed_universe_inherited_V5
    formula: r_stock - beta * r_market_loo
    missing_peer_bars: drop_peer_from_that_window_LOO_no_imputation
    listed_vs_eligible: >
      Beta panels use the listed common-stock universe (V5/V6). Impulse
      LOO and forward LOO use causally eligible peers that day, not every
      listed name. Missing a peer bar drops that peer from that window
      only. Do not re-intersect impulse and forward peer sets.
  impulse_residual:
    window: P0_close_to_P1_close
    formula: residual(P0 -> P1)
  forward_residual:
    formula: r_stock_fwd - beta * r_market_loo_fwd
    r_stock_fwd: horizon_close / entry_open - 1
    r_market_loo_fwd: equal_weight_LOO_eligible_peers_entry_open_to_horizon_close
    beta: same_causal_beta_as_impulse_that_session
    not_raw_stock_return: true
    not_impulse_window: true
  shock_z:
    formula: impulse_residual / prior_same_clock_residual_std
    prior_sessions: exact_20_research_sessions_immediately_before_event_day
    same_clock: same_ET_impulse_start_and_same_W_imp
    ddof: 1
    require_all_20_finite: true
    reachback: false
    imputation: false
    current_day_in_scale: false
  clocks:
    bar_label: minute_bar_start_ET
    completed_price: official_minute_close
    P0: completed close of the minute immediately before impulse start
    P1: completed close of the last impulse minute
    T_event: P1_bar
    signal_available_at: T_event_close_plus_0s
    skip_open: T_event_plus_1_open
    primary_entry: T_event_plus_2_open
    impulse_start_min: '10:00'
    entry_max: '14:00'
    close_et: '15:59'
    no_current_unfinished_minute: true
    max_impulse_start:
      W5: '13:54'
      W15: '13:44'
      W30: '13:29'
      W60: '12:59'
    timeline: >
      Impulse uses W_imp consecutive completed RTH minutes.
      P0 = close(t0 - 1m). P1 = close(t0 + W_imp - 1m).
      T_event is the P1 bar. Known at T_event+1m. Skip T_event+1 open.
      Research entry is T_event+2 open. Max starts force entry <= 14:00.
      Horizon H is entry open to close(entry + H - 1m).
      to_close is entry open to 15:59 close.
    common_cohort_completeness: >
      Shape, stability, D1 selection, and D2/D3 confirmation use one
      common event cohort. Require: (1) entry <= 14:00; (2) every target
      minute from P0 through 15:59 inclusive exists. Then all of
      5/10/15/30/60/120/to_close are observable on the same names/days.
      A missing internal minute through 15:59 invalidates the candidate
      for the common cohort.
    descriptive_unbalanced_horizons: >
      Per-horizon samples that drop events missing only later bars MAY
      be reported as descriptive_unbalanced. They MUST NOT determine
      shape class, stability, D1 freeze, or confirmatory tests.
    peer_completeness: window_specific_eligible_LOO_as_V6
  event_selection:
    per_ticker_day: first_qualifying_shock_only
    scan: impulse_starts_from_10_00_through_W_specific_max_inclusive_1m_steps
    qualify_iff:
      - contiguous_P0_through_P1
      - common_cohort_P0_through_1559
      - abs_shock_z_ge_2
      - causal_eligibility_and_beta
    reserve_at: signal_time_T_event_close_known
    future_outcomes_not_used_to_choose_or_replace_the_event: true
    later_valid_signal_cannot_replace_earlier_reserved_signal: true
  event_grid:
    impulse_window_minutes: [5, 15, 30, 60]
    min_abs_shock_z: [2.0]
    cartesian_event_definitions: 4
    no_wait_window_in_family_A: true
    not_every_integer_minute: true
  response_grid_minutes: [5, 10, 15, 30, 60, 120]
  response_to_close: same_session_1559
  shock_signed_forward: sign(impulse_residual) * forward_residual
  primary_estimand: equal_weight_trading_day_mean
  inference:
    unit: trading_day
    bootstrap_daily_means: 1000
    seed: 42
    bh_q: 0.10
    bh_on_d1_horizons: false
  sample:
    min_ticker_days: 750
    min_trading_days: 100
    min_tickers: 75
    max_top_ticker_share: 0.50
    min_win_rate: 0.48
    applied_on: common_cohort_anchor_horizon
  eligibility:
    inherit_v5_listed_common_stock: true
    price_prev_close_min: 1.0
    trailing_20d_median_rth_dollar_volume_min: 1000000.0
  splits:
    method: chronological_unsealed
    warmup_last_day: '2021-10-28'
    discovery_D1: {start: '2021-10-29', end: '2023-10-17', n_days: 494}
    validation_D2: {start: '2023-10-18', end: '2024-10-10', n_days: 247}
    confirmation_D3: {start: '2024-10-11', end: '2026-10-01', n_days: 494}
    sealed_oos: closed_do_not_open
    d1_subperiods: chronological_halves_of_D1_calendar_days

mechanism_families:
  A_MARKET_RELATIVE_SHOCK_RESOLUTION:
    status: DESIGN_ONLY_PRIMARY_CANDIDATE
    question: >
      Does an abnormal residual move continue, reverse, decay, delay, or
      persist across the preregistered response grid?
    event: family_A_impulse_only
    incremental_to_v6: replace_single_15m_and_retention_wait_with_full_curve
  B_SHOCK_ABSORPTION_RETENTION:
    status: DESIGN_ONLY_NOT_IN_FIRST_D1_EXECUTE
    question: >
      After the shock, does a short completed absorption window (remaining
      residual / impulse residual, unclipped) contain incremental information
      about later curve shape versus impulse-only?
    cannot_rescue_family_A: true
    wait_windows_if_later_approved: [5, 15]
    note: V6 already killed high-retention continuation at 15m/15m. Family B
      is a curve-level incremental test, not a V6 retune.
  C_ABNORMAL_VOLUME_PRICE_RESPONSE:
    status: DESIGN_ONLY_NOT_IN_FIRST_D1_EXECUTE
    question: >
      When RTH dollar volume in the impulse window is abnormal versus the
      exact prior 20 same-clock sessions, does volume_z jointly with shock_z
      predict signed residual response shape?
    volume_scale: exact_20_prior_same_clock_impulse_dollar_volume_std
    new_paid_data: false
  D_CROSS_SECTIONAL_RELATIVE_DISLOCATION:
    status: DESIGN_ONLY_NOT_IN_FIRST_D1_EXECUTE
    question: >
      When one stock's impulse residual is extreme in the contemporaneous
      eligible cross-section (LOO rank or residual z vs peers that day),
      does that relative dislocation resolve predictably?
    not_v5_close_clock: true

response_surface:
  unit: one_curve_per_event_definition
  columns: [h5, h10, h15, h30, h60, h120, to_close]
  shape_input: equal_weight_trading_day_mean_of_shock_signed_forward_residual
  common_cohort_only_for_shape_stability_selection: true
  also_report: [se, ci, p_one_sided, n_days, n_tickers, top_ticker_share, win_rate]
  descriptive_unbalanced_allowed: true
  descriptive_unbalanced_cannot_determine_shape: true
  discovery_trials_are_curves_not_horizons: true
  first_wave_curves: 4

near_zero_bp: 1.0

shape_rule:
  applied_to: common_cohort_shock_signed_equal_day_means
  assignment: first_matching_rule_in_the_order_below
  d1_does_not_pick_argmax_bp: true
  strong: abs_mean_bp_ge_1
  rules_in_order:
    - id: persistent_repricing
      when: >
        15, 30, 60, 120, and to_close are all strong and have the same
        sign as the shock.
      direction: same_as_shock
      anchor_minutes: 30
      hierarchical_persistence: 15_30_60_120_to_close_all_strong_same_as_shock
    - id: continuation
      when: >
        not persistent_repricing; at least two of {15,30,60} strong and
        same sign as shock; 120m not strong opposite to shock.
      direction: same_as_shock
      anchor_minutes: >
        30 if 30 is strong same-as-shock; else 15 if 15 and 60 are the
        two strong points; else 15 if {15,30}; else 30 if {30,60}.
      hierarchical_persistence: qualifying_15_30_60_points_remain_same_sign_as_shock
    - id: reversal
      when: 15m strong opposite to shock AND 30m strong opposite to shock
      direction: opposite_to_shock
      anchor_minutes: 30
      hierarchical_persistence: 15_and_30_remain_strong_opposite_to_shock
    - id: temporary_continuation_then_reversal
      when: >
        (5m or 10m) strong same as shock AND (60m or 120m) strong opposite
        to shock; not already classified above.
      direction: opposite_to_shock
      anchor_minutes: 60 if 60 strong opposite else 120
      hierarchical_persistence: >
        Early continuation is definitional only. Confirmatory neighborhood
        is the late reversal: if both 60 and 120 are strong they must share
        the opposite-to-shock sign; a near-zero late point is not a conflict.
    - id: delayed_continuation
      when: >
        5m and 10m |mean_bp| < 1; 30m and 60m strong same sign as shock.
      direction: same_as_shock
      anchor_minutes: 30
      hierarchical_persistence: >
        30 and 60 remain strong same as shock. 5 and 10 remain |mean_bp| < 1.
        Do not require 15m to be strong (it may be near zero).
    - id: fast_decay
      when: 5m strong same as shock; 30m and 60m |mean_bp| < 1
      direction: same_as_shock
      anchor_minutes: 5
      freeze_eligible: true
      hierarchical_persistence: >
        5m remains strong same as shock. 30m and 60m remain |mean_bp| < 1.
        15m is not strong opposite. Neighborhood is decay persistence, not
        two strong points in {15,30,60}.
    - id: no_stable_effect
      when: none_of_the_above
      freeze_eligible: false

stability:
  purpose: prefer_neighborhood_consistency_over_single_maximum
  cohort: common_cohort_only
  applied_before_d1_freeze: true
  neighborhood_is_shape_conditional: true
  require_all:
    - shape_not_no_stable_effect
    - sample_and_concentration_on_anchor
    - shape_conditional_hierarchical_persistence
    - not_singleton_spike
    - d1_subperiod_sign_agreement_on_anchor
  not_singleton_spike: >
    On the common-cohort curve, reject if the maximum |mean_bp| grid point
    is not the shape's frozen anchor and both adjacent grid points on
    [5,10,15,30,60,120,to_close] are strong opposite to that max's sign.
  d1_subperiod_sign_agreement_on_anchor: >
    Split D1 research days at the median D1 calendar date. Common-cohort
    equal-day mean at the frozen anchor, in the frozen direction, must
    have mean > 0 in both halves. A half below sample floors fails
    stability; it is not skipped.
  example_strong: {30m_bp: 4, 60m_bp: 6, 120m_bp: 5}
  example_weak: {15m_bp: 0, 30m_bp: -1, 47m_bp: 12, 60m_bp: 0}
  forty_seven_minutes_not_on_grid: true

d1:
  inspect: preregistered_response_surface_only
  event_definitions: 4
  families_executed: [A]
  families_reported_not_executed: [B, C, D]
  select_at_most: 2
  selection: stable_shapes_not_max_mean
  if_none: KILL_AT_D1
  if_more_than_2_stable_tiebreak_in_order:
    - shape_rank_persistent_then_continuation_then_delayed_then_reversal_then_temp_rev_then_fast_decay
    - larger_abs_equal_day_mean_bp_on_that_curve_frozen_anchor
    - smaller_W_imp
    - lexicographic_W_imp_then_shape_id
  freeze_fields:
    - family
    - impulse_window_minutes
    - min_abs_shock_z
    - shape_class
    - direction
    - anchor_horizon_minutes
    - hierarchical_persistence_rule
    - primary_estimand
    - sample_gates
    - entry_clock
    - common_cohort_rule
  each_frozen_candidate_is_exactly_one_confirmatory_anchor_hypothesis: true
  significance_threshold: none

d2:
  open_only_if: D1_froze_at_least_one_candidate
  no_retune: true
  no_horizon_change_if_primary_fails: true
  no_nearby_point_rescue: true
  evaluate: frozen_candidates_only
  bh:
    q: 0.10
    across: exactly_the_K_frozen_anchor_hypotheses
    K: number_of_D1_frozen_candidates_1_or_2
    not_across_horizons_of_the_curve: true
  hierarchical_required_gates_not_in_bh:
    - sample_and_concentration_on_anchor
    - equal_day_mean_gt_0_in_frozen_direction_on_anchor
    - economic_floor_3bp_on_anchor
    - shape_conditional_persistence_on_common_cohort
  if_any_fail: KILL_AT_D2
  d3_opened: false
  next_action_even_if_pass: STOP_FOR_INDEPENDENT_REVIEW

d3:
  open_only_if: explicit_separate_authorization_and_D2_survival
  no_automatic_launch: true
  economic_floor_bp: 12
  bh_q: 0.10
  bh_across: same_K_frozen_anchor_hypotheses

multiplicity:
  first_wave_discovery_curves: 4
  horizons_are_descriptors_not_extra_trials: true
  shape_classifier_frozen_before_d1: true
  confirmatory_count: K_frozen_anchor_hypotheses
  d2_d3_bh_q: 0.10
  persistence_is_hierarchical_not_bh: true
  families_B_C_D_not_in_first_wave_count: true
  no_post_hoc_47m: true

leakage:
  - completed_bars_only
  - T_event_plus_2_open_entry
  - no_T_event_plus_1_open
  - first_qualifying_shock_reserved_before_forwards
