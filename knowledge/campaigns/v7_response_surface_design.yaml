  - equal_weight_trading_day_mean
  - BH_q_0_10
  - first_event_reservation
  - window_specific_peer_LOO
  - readiness_vs_explicit_execute_flags
  - identity_pins

new_code_required:
  - common_cohort_filter_P0_through_1559
  - multi_horizon_forward_residual_vector
  - eligible_LOO_on_entry_to_horizon
  - frozen_shape_classifier_with_per_shape_anchor
  - shape_conditional_persistence
