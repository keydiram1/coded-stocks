why_retention_beats_others: >
  Highest total and the only candidate measurable with stock minutes that is
  not a V2 rerun. Residual is market-LOO only. Premarket/open collide with
  V1/V2 G. Failed-impulse collides with V2 B/I. Options aggregates cannot
  be directional.

argument_against_retention: >
  Retention may be momentum with extra steps. shock_z matching plus the
  incremental day-delta gate exists to kill the campaign if retention adds
  nothing. Shocked names are where spreads destroy paper 15m means. T1+2
  entry is more conservative and may shrink any real edge.
