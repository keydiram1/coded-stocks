why_retention_beats_others: >
  Highest total and the only candidate that is both measurable with stock
  minutes and not a rerun of a failed V2 pattern family. It uses the V5
  expected/observed/discrepancy template on an intraday shock instead of the
  closed close-window. Premarket/open ideas collide with V1/V2 G. Failed-impulse
  collides with V2 B/I. Options activity cannot be directional on aggregates.

argument_against_retention: >
  Retention may be a restatement of momentum: names still displaced after 10
  minutes are names still trending. Minute OHLC also cannot sequence the
  impulse bar. The control hypothesis H3_IMPULSE_ONLY exists to kill the
  campaign if retention adds nothing. Shocked names are exactly where spreads
  and slippage destroy paper 15m means.
