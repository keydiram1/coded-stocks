candidates:
  - id: IDIO_SHOCK_RETENTION_V1
    name: idiosyncratic shock retention (information vs flow)
    overlap: PARTIALLY_OVERLAPPING
    overlap_note: >
      Uses V5-style LOO residual construction and a path idea from V2, but the
      state is retention of an identified shock after a wait window, not V2
      pullback-band reacceleration, not V4 snapshot residual, not V5 close clock.
    rationale: >
      A short idiosyncratic impulse is a mix of information and temporary pressure.
      After a completed wait, retained displacement is the information component;
      dissipated displacement is exhausted flow. Direction follows that split.
    signal_at_T: >
      Completed impulse window residual, completed wait-window remaining residual,
      retention ratio, all using bars whose first_available_at <= T. No current
      unfinished minute.
    expected_response: >
      High retention => continuation of shock sign. Low retention => reversal of
      shock sign. Impulse-only continuation is a control, not a promotion path.
    horizon: 15m_primary after next completed-minute open
    data_required: stock minute OHLCV plus causal beta/LOO
    data_available: yes_2021-10-01_to_2026-10-01
    confounders: [generic_momentum, volatility_scaling, open_close_regimes, ticker_clustering]
    leakage: current_bar_if_impulse_uses_unfinished_minute
    pit: instruments_parquet_not_session_dated
    execution: next_bar_open_not_a_fill; wide_spreads_on_shocked_names
    why_fail: retention_is_noisy_momentum; minute_path_inside_impulse_ambiguous
    falsify: >
      H1 mean<=0 on confirmation; or H1 does not beat impulse-only control;
      or only H2 works and is then promoted (forbidden).
    scores: {A: 4, B: 4, C: 3, D: 4, E: 4, F: 3, G: 3, total: 25}

