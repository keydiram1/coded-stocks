candidates:
  - id: MARKET_RESIDUAL_SHOCK_RETENTION_V1
    former_id: IDIO_SHOCK_RETENTION_V1
    name: market-residual shock retention (information vs flow)
    overlap: PARTIALLY_OVERLAPPING
    overlap_note: >
      Uses V5-style LOO market residual construction and a path idea from V2,
      but the state is retention of a market-residual shock after a wait,
      not V2 pullback-band reacceleration, not V4 snapshot residual, not V5
      close clock. Residual is market-only, not sector-idiosyncratic.
    rationale: >
      A short market-residual impulse mixes information and temporary pressure.
      After a completed wait, retained displacement is the information
      component; dissipated displacement is exhausted flow.
    signal_at_T: >
      Completed P0/P1/P2 closes, impulse_residual, remaining_residual,
      retention, shock_z vs exact prior 20 same-clock residuals. Signal
      known after T1 close. Primary entry T1+2 open.
    expected_response: >
      High retention => continue impulse_residual sign. Low retention =>
      reverse. Impulse-only is control. H1 must beat stratified complement.
    horizon: 15m_primary after T1_plus_2_open
    data_required: stock minute OHLCV plus causal beta/LOO
    data_available: yes_2021-10-01_to_2026-10-01
    confounders: [generic_momentum, volatility_scaling, open_close_regimes, ticker_clustering]
    leakage: T1_plus_1_open_would_be_too_tight
    pit: instruments_parquet_not_session_dated
    execution: T1_plus_2_open_not_a_fill; wide_spreads_on_shocked_names
    why_fail: retention_is_noisy_momentum; minute_path_inside_impulse_ambiguous
    falsify: >
      H1 mean<=0 on confirmation; or incremental day-delta<=0; or only H2/H3
      work (not campaign success).
    scores: {A: 4, B: 4, C: 3, D: 4, E: 4, F: 3, G: 3, total: 25}

