CLOSE_DISLOCATION_CONTINUATION_V1:
  mechanism_id: forced_eod_preclose_flow_continuation
  hypothesis_family: close_dislocation_continuation
  auction_claim: false
  direction_policy: continuation_no_flip
  discrepancy: observed_minus_expected
  direction_rule: >
    discrepancy > 0 => LONG continuation;
    discrepancy < 0 => SHORT continuation.
  primary_outcome: next_open_to_15m
  diagnostic_outcomes: [close_to_next_open, next_open_to_5m, next_open_to_30m]
  executable_claim: false
  thresholds_inherited_from: CLOSE_DISLOCATION_REVERSAL_V1_D1_freeze
  do_not_reestimate_thresholds: true
  h1_remains_primary: true
  d1_d2_not_confirmation: true
  reviewer_approval_required: true
  absolute_family_trial_count: 3
  normalized_family_trial_count: 2
  total_trial_count: 5
  normalized_scale:
    type: same_clock_residual_std
    lookback_sessions: 20
    threshold_abs_z: 2.0
    causal_only: true
    source: stored_event_discrepancy_from_source_run
    note: >
      Denominator is sample std of the prior 20 finite stored same-clock
      residuals for that instrument. Each stored discrepancy is
      observed_final_5m − beta_available_at_that_session × eligible LOO
      final-5m market. Pre-D3 event partitions are scale history only and
      are not confirmation. Missing, zero, non-finite, or short history
      makes z unavailable. No fill with 1, cross-section, market, current-day,
      or future scale. This family asks whether the residual was abnormal
      versus the name's own historical residual distribution, not whether
      it exceeded a fixed return threshold.
  hypotheses:
    - hypothesis_id: H1_PRIMARY
      role: primary
      family: absolute_continuation
      dislocation_abs_min: 0.0046049372056016155
      rvol_min: 1.3190530517761354
      require_rvol: true
    - hypothesis_id: H2_ABS_Q95
      role: robustness
      family: absolute_continuation
      dislocation_abs_min: 0.0063376019291080795
      rvol_min: 1.3190530517761354
      require_rvol: true
    - hypothesis_id: H3_DISLOCATION_ONLY
      role: robustness
      family: absolute_continuation
      dislocation_abs_min: 0.0046049372056016155
      rvol_min: null
      require_rvol: false
    - hypothesis_id: H4_Z2_RVOL
      role: robustness
      family: volatility_normalized_continuation
      dislocation_abs_min: null
      z_abs_min: 2.0
      rvol_min: 1.3190530517761354
      require_rvol: true
      frozen_from_split: ex_ante
    - hypothesis_id: H5_Z2_ONLY
      role: robustness
      family: volatility_normalized_continuation
      dislocation_abs_min: null
      z_abs_min: 2.0
      rvol_min: null
      require_rvol: false
      frozen_from_split: ex_ante
  trial_count_rule: one_trial_per_hypothesis_on_primary_outcome_only
  recorded_but_not_selected: [close_to_next_open, next_open_to_5m, next_open_to_30m]
  volatility_normalization:
