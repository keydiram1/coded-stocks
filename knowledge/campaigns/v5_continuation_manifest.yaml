note: >
  CLOSE_DISLOCATION_CONTINUATION_V1 is a NEW confirmation campaign.
  It is not a modification, rescue, or reinterpretation of
  CLOSE_DISLOCATION_REVERSAL_V1. Continuation was formulated only after
  reversal failed in D1 and D2. D1/D2 are discovery evidence for this new
  question, not confirmation. D3 (2024-10-11 through 2026-10-01, 494 days)
  is the sole untouched historical confirmation split. Absolute thresholds are
  inherited unchanged from the original D1 freeze. H1 remains PRIMARY
  despite H2 having larger discovery magnitude. A separate volatility-normalized
  family (H4/H5, |z|>=2 ex ante) was preregistered before D3 inspection because
  absolute residual gates can overweight high-idiosyncratic-vol names.
  D1/D2 must not choose z=2. H4/H5 are robustness, not primary. SIGNAL_ONLY.
  instruments.parquet is not session-dated listing history. Any survivor still
  requires execution modeling and proper PIT listing replication before
  trading-grade evidence. Sealed OOS stays closed. No fourth historical OOS exists.

