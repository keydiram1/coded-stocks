# V5 CLOSE_DISLOCATION gates. Campaign-specific. SIGNAL_ONLY.
# Independent review complete. FROZEN BEFORE empirical V5 execution.
# Numerical gates are unchanged; this is not a result file.
version: v5_gates_close_dislocation_v1
campaign: CLOSE_DISLOCATION_REVERSAL_V1
status: SIGNAL_ONLY
execution_status: FROZEN
thresholds_status: FROZEN_BEFORE_EMPIRICAL_EXECUTION
reviewer_approval_required: false
frozen_before_empirical_execution: true

primary_outcome: next_open_to_15m
primary_horizon_minutes: 15

# Signed floors on primary_signed (positive = predicted reversal worked).
# NOT absolute-value tests. Negative means must never PASS.
d2:
  signed_mean_floor: 0.0003
  signed_mean_floor_bp: 3
  refit: false
  move_thresholds: false
  flip_direction: false
  note: mean <= 0 => KILL direction_failed; 0 < mean < 3bp => KILL below_d2_floor.

d3:
  signed_mean_floor: 0.0012
  signed_mean_floor_bp: 12
  refit: false
  rescue: false
  require_sign_match_d2: true
  note: >
    mean <= 0 => KILL direction_failed. not D3 BH survivor => KILL d3_not_significant.
    BH survivor and 0 < mean < +12bp => VALIDATED_SUBTHRESHOLD_PHENOMENON.
    BH survivor and mean >= +12bp => RESEARCH_PASS.

sample:
  min_ticker_days: 750
  min_trading_days: 100
  min_tickers: 75
  max_top_ticker_share: 0.50
  min_win_rate: 0.48
  counts_on: finite_primary_signed_only

inference:
  association_unit: trading_day
  block: trading_day
  bootstrap_draws: 1000
  bootstrap_seed: 42
  multiple_testing: BH
  bh_q: 0.10
  test: one_sided_greater_on_daily_means
  count_every_hypothesis_as_a_trial: true
  d1_significance_tuning: false
  d2_bh_across_preregistered_hypotheses: true
  d3_only_d2_bh_survivors: true

decisions:
  KILL: fails sample, concentration, sign, D2 floor, BH, or D3 mean <= 0
  VALIDATED_SUBTHRESHOLD_PHENOMENON: D3 0 < mean < +12bp and remaining gates pass
  RESEARCH_PASS: D3 mean >= +12bp and remaining gates pass
  note: RESEARCH_PASS is not tradable. SIGNAL_ONLY. Sealed OOS stays closed. Negative means never PASS.

note: Zero RESEARCH_PASS is an acceptable scientific outcome.
