id: premarket_high_behavior_v1
family: premarket_open
description: >
  Test opening-session behavior when a name gaps and trades at or through the
  premarket high. SIGNAL_ONLY; not a claim that PM highs predict RTH.
side: long
universe:
  exchanges:
    - NASDAQ
    - NYSE
    - NYSE_AMERICAN
  security_type: COMMON_STOCK
  price_prev_close:
    min: 1.0
    max: 20.0
trigger:
  session: RTH
  time_et:
    start: "09:35"
    end: "10:15"
  conditions:
    - feature: gap_pct
      op: ">="
      value: 0.05
    - feature: dist_from_premarket_high
      op: ">="
      value: 0.0
features:
  gap_pct:
    asof: event_time
  dist_from_premarket_high:
    asof: event_time
  premarket_volume:
    asof: event_time
outcomes:
  forward_returns:
    - 1m
    - 5m
    - 15m
    - 30m
  barriers:
    take_profit: 0.03
    stop_loss: -0.02
  calculate:
    - MFE
    - MAE
execution:
  discovery_model: next_bar_open
  status: SIGNAL_ONLY
statistics:
  cluster_by: symbol_day
  bootstrap_unit: trading_day
  multiple_testing: BH
  q_target: 0.05
validation:
  chronological: true
  freeze_before_oos: true
falsification:
  - Is premarket high just a proxy for gap size?
  - Does current (as-of-today) float accidentally leak if used later?
