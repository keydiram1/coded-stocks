id: extreme_extension_fade_v1
family: extension_fade
description: >
  Test whether short-term upside extensions near the session high have a
  different (fade) forward return distribution. Side=short. SIGNAL_ONLY.
side: short
universe:
  exchanges:
    - NASDAQ
    - NYSE
    - NYSE_AMERICAN
  security_type: COMMON_STOCK
  price_prev_close:
    min: 1.0
    max: 20.0
trigger:
  session: RTH
  time_et:
    start: "09:35"
    end: "11:00"
  conditions:
    - feature: ret_15m
      op: ">="
      value: 0.06
    - feature: dist_from_session_high
      op: ">="
      value: -0.005
features:
  ret_15m:
    asof: event_time
  dist_from_session_high:
    asof: event_time
  acceleration:
    asof: event_time
outcomes:
  forward_returns:
    - 1m
    - 5m
    - 15m
    - 30m
  barriers:
    take_profit: 0.03
    stop_loss: -0.02
  calculate:
    - MFE
    - MAE
execution:
  discovery_model: next_bar_open
  status: SIGNAL_ONLY
statistics:
  cluster_by: symbol_day
  bootstrap_unit: trading_day
  multiple_testing: BH
  q_target: 0.05
validation:
  chronological: true
  freeze_before_oos: true
falsification:
  - Is this just ordinary morning volatility?
  - Does it vanish after excluding the top 1% of events?
