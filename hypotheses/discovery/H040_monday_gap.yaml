id: H040_monday_gap
family: calendar_gap
description: >
  Monday RTH open gap-up >= 8% (prev close $1-20 listed common). First event
  per ticker-day. Test SHORT fade. SIGNAL_ONLY. Not a midweek 15% gap family.
side: short
universe:
  exchanges:
    - NASDAQ
    - NYSE
    - NYSE_AMERICAN
  security_type: COMMON_STOCK
  price_prev_close:
    min: 1.0
    max: 20.0
trigger:
  session: RTH
  time_et:
    start: "09:35"
    end: "09:36"
  conditions:
    - feature: gap_pct
      op: ">="
      value: 0.08
features:
  gap_pct:
    asof: event_time
outcomes:
  forward_returns:
    - 1m
    - 5m
    - 15m
    - 30m
    - 60m
  barriers:
    take_profit: 0.03
    stop_loss: -0.02
  calculate:
    - MFE
    - MAE
execution:
  discovery_model: next_bar_open
  status: SIGNAL_ONLY
statistics:
  cluster_by: symbol_day
  bootstrap_unit: trading_day
  multiple_testing: BH
  q_target: 0.05
validation:
  chronological: true
  freeze_before_oos: true
falsification:
  - Monday sample size may be thin on a fast-screen panel.
